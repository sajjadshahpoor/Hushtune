<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
  #player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  var player;
  var videoId = new URLSearchParams(window.location.search).get('v');

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: {
        playsinline: 1,
        controls: 0,
        modestbranding: 1,
        rel: 0
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  }

  function onPlayerReady(event) {
    window.webkit.messageHandlers.hushtune.postMessage({
      event: 'ready',
      duration: player.getDuration()
    });
    setInterval(function () {
      if (player && player.getCurrentTime) {
        window.webkit.messageHandlers.hushtune.postMessage({
          event: 'time',
          currentTime: player.getCurrentTime(),
          duration: player.getDuration()
        });
      }
    }, 500);
  }

  function onPlayerStateChange(event) {
    window.webkit.messageHandlers.hushtune.postMessage({
      event: 'stateChange',
      state: event.data
    });
  }

  function hushtunePlay() { if (player) player.playVideo(); }
  function hushtunePause() { if (player) player.pauseVideo(); }
  function hushtuneSeek(seconds) { if (player) player.seekTo(seconds, true); }
</script>
</body>
</html>
